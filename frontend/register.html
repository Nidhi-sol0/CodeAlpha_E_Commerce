<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Create account | LumaCart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="./css/styles.css"><script src="./js/app.js" defer></script></head>
  <body data-page="register"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
    <main id="main-content" class="auth-page"><section class="auth-panel" aria-labelledby="auth-title"><a class="auth-back" href="./index.html">← Back to LumaCart</a><p class="eyebrow">A BETTER WAY TO FIND YOUR FAVORITES</p><h1 id="auth-title">Create your account</h1><p class="auth-subtitle">A few details, then you're right at home.</p><div id="auth-message" class="form-message" role="alert" hidden></div>
      <form id="register-form" class="auth-form" novalidate><label class="form-field" for="name"><span>Name</span><input class="form-control" id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="80"></label><label class="form-field" for="email"><span>Email</span><input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="form-field" for="password"><span>Password</span><span class="password-wrap"><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password">Show</button></span><small>Use at least 8 characters.</small></label><label class="form-field" for="confirm-password"><span>Confirm password</span><span class="password-wrap"><input class="form-control" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show confirmation password">Show</button></span></label><button class="button button-primary auth-submit" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p></section>
      <aside class="auth-aside"><div class="auth-aside-image" role="img" aria-label="Curated everyday essentials arranged in warm natural light"></div><div class="auth-aside-copy"><span>THE LUMACART WAY</span><p>Thoughtful finds. Everyday good.</p></div></aside></main>
    <div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div><dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
  </body>
</html>
