<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>My account | LumaCart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="./css/styles.css"><script src="./js/app.js" defer></script></head>
  <body data-page="account"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
    <main id="main-content" class="wrap page-main account-page"><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="./index.html">Home</a><span aria-hidden="true">/</span><span>My account</span></nav><div id="account-loading" class="account-loading" aria-live="polite">Loading your account…</div>
      <section id="account-content" hidden aria-labelledby="account-title"><div class="account-heading"><p class="eyebrow">YOUR LUMACART</p><h1 id="account-title">My account</h1><p id="account-greeting"></p></div><div class="account-layout">
        <nav class="account-nav" aria-label="Account sections"><button class="account-tab is-active" type="button" data-account-tab="profile" aria-current="page">Profile</button><button class="account-tab" type="button" data-account-tab="orders">Orders <span id="account-order-count">0</span></button><button class="account-tab" type="button" data-account-tab="wishlist">Wishlist <span id="account-wishlist-count">0</span></button><button class="account-tab is-disabled" type="button" disabled>Addresses <span>Coming soon</span></button><button class="account-tab is-disabled" type="button" disabled>Settings <span>Coming soon</span></button><button class="account-tab account-logout" type="button" data-logout>Log out <span aria-hidden="true">↗</span></button></nav>
        <div class="account-content-panel"><section id="profile-panel" class="account-panel" aria-labelledby="profile-title"><p class="eyebrow">PERSONAL DETAILS</p><h2 id="profile-title">Profile</h2><p class="panel-intro">Manage the details connected to your account.</p><div id="profile-message" class="form-message" role="status" hidden></div><form id="profile-form" class="profile-form"><label class="form-field" for="profile-name"><span>Name</span><input id="profile-name" class="form-control" name="name" required minlength="2" maxlength="80" autocomplete="name"></label><label class="form-field" for="profile-email"><span>Email</span><input id="profile-email" class="form-control" name="email" type="email" required autocomplete="email"></label><div class="profile-meta"><span>Member since</span><strong id="profile-created"></strong></div><button class="button button-primary" type="submit">Save changes</button></form></section><section id="orders-panel" class="account-panel" hidden aria-labelledby="orders-title"><p class="eyebrow">YOUR PURCHASES</p><h2 id="orders-title">Order history</h2><p class="panel-intro">Orders placed with this account.</p><div id="orders-loading" class="orders-loading" role="status" hidden>Loading your orders…</div><div id="orders-error" class="form-message" role="alert" hidden></div><div id="orders-list" class="orders-list"></div><div id="orders-pagination" class="orders-pagination"></div></section><section id="wishlist-panel" class="account-panel" hidden aria-labelledby="wishlist-title"><p class="eyebrow">SAVED FOR LATER</p><h2 id="wishlist-title">Your wishlist</h2><div id="account-wishlist" class="product-grid product-grid-2"></div></section></div>
      </div></section>
    </main>
    <div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div><dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
  </body>
</html>
