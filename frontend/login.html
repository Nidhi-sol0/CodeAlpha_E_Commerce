<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Sign in | LumaCart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="./css/styles.css"><script src="./js/app.js" defer></script></head>
  <body data-page="login"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
    <main id="main-content" class="auth-page"><section class="auth-panel" aria-labelledby="auth-title"><a class="auth-back" href="./index.html">← Back to LumaCart</a><p class="eyebrow">YOUR GOOD THINGS ARE WAITING</p><h1 id="auth-title">Welcome back</h1><p class="auth-subtitle">Sign in to continue.</p><div id="auth-message" class="form-message" role="alert" hidden></div>
      <form id="login-form" class="auth-form" novalidate><label class="form-field" for="email"><span>Email</span><input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="form-field" for="password"><span>Password</span><span class="password-wrap"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password">Show</button></span></label><div class="auth-meta"><span></span><span class="muted-note">Password recovery coming soon</span></div><button class="button button-primary auth-submit" type="submit">Sign in</button></form><p class="auth-switch">Don't have an account? <a href="./register.html">Create account</a></p></section>
      <aside class="auth-aside"><div class="auth-aside-image" role="img" aria-label="A calm, thoughtfully styled living space"></div><div class="auth-aside-copy"><span>THE LUMACART WAY</span><p>Good design belongs in the everyday.</p></div></aside></main>
    <div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div><dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
  </body>
</html>
